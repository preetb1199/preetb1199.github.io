<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><title>MetaAudit PPI plus plus correction on a 10-item textbook example</title><rect x="0" y="0" width="1200" height="450" rx="0" fill="#070B12" stroke="none" stroke-width="1.4"/><text x="45" y="44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#C2B7FF">PPI++ / WORKED EXAMPLE</text><text x="45" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#F4F7FD">Measure the model. Then measure its error.</text><rect x="45" y="132" width="332" height="158" rx="14" fill="#14273B" stroke="#344158" stroke-width="1.4"/><text x="67" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#8CC7FF">FULL POPULATION</text><text x="67" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#D9E0EE">Judge mean</text><text x="67" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#F4F7FD">38%</text><rect x="434" y="132" width="332" height="158" rx="14" fill="#14332E" stroke="#344158" stroke-width="1.4"/><text x="456" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#7FE1CC">RANDOM AUDIT</text><text x="456" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#D9E0EE">Human mean</text><text x="456" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#F4F7FD">40%</text><rect x="823" y="132" width="332" height="158" rx="14" fill="#2A2446" stroke="#344158" stroke-width="1.4"/><text x="845" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#C2B7FF">SAME AUDIT</text><text x="845" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#D9E0EE">Judge mean</text><text x="845" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#F4F7FD">42%</text><path d="M45 326 L1155 326" stroke="#344158" stroke-width="1.7" fill="none"/><rect x="46" y="355" width="1110" height="59" rx="10" fill="#182130" stroke="#344158" stroke-width="1.4"/><text x="68" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#8CC7FF">FULL JUDGE</text><text x="237" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F4F7FD">38%</text><text x="337" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="550" fill="#BAC6D7">+</text><text x="391" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#7FE1CC">AUDIT RESIDUAL</text><text x="588" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#F4F7FD">(40 − 42) = −2 pp</text><text x="828" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="550" fill="#BAC6D7">=</text><text x="870" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800" fill="#C2B7FF">36%</text><text x="967" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#D9E0EE">PPI estimate</text><text x="45" y="440" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#BAC6D7">Illustrative textbook example: reference truth = 30%; no one audit is guaranteed to be exact.</text></svg>
