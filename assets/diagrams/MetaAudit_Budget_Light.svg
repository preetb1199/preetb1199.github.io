<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="443" viewBox="0 0 1200 443" role="img"><title>MetaAudit research visualization</title><rect width="1200" height="443" fill="#FBFCFE"/><text x="42" y="45" fill="#785DAF" font-size="13" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start" letter-spacing="2.2">HUMAN AUDIT BUDGET</text><text x="42" y="88" fill="#172943" font-size="33" font-weight="600" font-family="Inter,Arial,sans-serif" text-anchor="start">The value is fewer trusted labels—not fewer checks.</text><text x="42" y="152" fill="#172943" font-size="22" font-weight="660" font-family="Inter,Arial,sans-serif" text-anchor="start">Human-only audit</text><rect x="42" y="172" width="985" height="39" rx="7" fill="#F3F6FC" stroke="#D6DDEA" stroke-width="1.4"/><rect x="42" y="172" width="942.645" height="39" rx="7" fill="#2C78B8" stroke="none" stroke-width="1.4"/><text x="1050" y="205" fill="#2C78B8" font-size="36" font-weight="740" font-family="Inter,Arial,sans-serif" text-anchor="start">957</text><text x="42" y="272" fill="#172943" font-size="22" font-weight="660" font-family="Inter,Arial,sans-serif" text-anchor="start">2-judge ensemble + PPI++</text><rect x="42" y="292" width="985" height="39" rx="7" fill="#F3F6FC" stroke="#D6DDEA" stroke-width="1.4"/><rect x="42" y="292" width="774.21" height="39" rx="7" fill="#1A8A7B" stroke="none" stroke-width="1.4"/><text x="1050" y="325" fill="#1A8A7B" font-size="36" font-weight="740" font-family="Inter,Arial,sans-serif" text-anchor="start">786</text><rect x="41" y="381" width="1117" height="42" rx="8" fill="#E5F6F1" stroke="#D6DDEA" stroke-width="1.4"/><text x="62" y="409" fill="#172943" font-size="18" font-weight="550" font-family="Inter,Arial,sans-serif" text-anchor="start">171 fewer audits (≈18%) for the reported ±2 percentage-point target</text></svg>
