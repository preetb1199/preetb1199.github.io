<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="CORA negative policy effect of detector gating"><title>CORA negative policy effect of detector gating</title><desc></desc><rect x="0" y="0" width="1200" height="480" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="42" y="47" fill="#2f84de" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="2">07 / DECISION COSTS</text><text x="42" y="89" fill="#1b2943" font-size="32" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="start" >A bad alarm can erase useful signal</text><text x="42" y="120" fill="#64748c" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" >Closed-loop simulated trading • controlled track • 30% held-out prevalence • 200 assignments</text><rect x="55" y="147" width="515" height="252" rx="17" fill="#f6f8fd" stroke="#d6ddeb" stroke-width="1"/><rect x="615" y="147" width="532" height="252" rx="17" fill="#f6f8fd" stroke="#d6ddeb" stroke-width="1"/><text x="79" y="196" fill="#c85d74" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" >DETECTOR-GATED VS NAIVE</text><text x="79" y="267" fill="#c85d74" font-size="57" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="start" >−3.35%</text><text x="79" y="303" fill="#1b2943" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" text-anchor="start" >annualized return difference</text><text x="79" y="343" fill="#64748c" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" >95% CI: −6.08% to −1.25%</text><text x="643" y="197" fill="#1f9e90" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" >INTERPRETATION</text><text x="643" y="246" fill="#1b2943" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" text-anchor="start" >A detector trained on familiar failures</text><text x="643" y="290" fill="#1b2943" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" text-anchor="start" >rejected good cases on novel corruptions.</text><text x="643" y="334" fill="#1f9e90" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" text-anchor="start" >The intervention hurt in this simulation.</text><text x="60" y="449" fill="#64748c" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" >Designed signal yields unrealistically large absolute Sharpe: interpret only policy differences, not profitability.</text></svg>