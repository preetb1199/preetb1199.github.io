<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 455" role="img" aria-labelledby="title desc"><title id="title">AgentSentry research explanatory diagram</title><desc id="desc">A source-grounded scientific illustration. This is not experimental log output.</desc><rect width="1120" height="455" fill="#fbfcfe"/><text x="44" y="60" font-size="14" font-weight="700" fill="#7e6be4">PROVENANCE / FOLLOW THE ARGUMENT</text><text x="44" y="100" font-size="30" font-weight="500" fill="#1b2943">The same tool can be safe or unsafe.</text><text x="44" y="136" font-size="16" font-weight="400" fill="#596b84">Authorization depends on the origin and scope of each critical value.</text><rect x="42" y="178" width="269" height="124" rx="13" fill="#ffffff" stroke="#dfe6ef" stroke-width="1.5" /><rect x="42" y="178" width="7" height="124" rx="5" fill="#1fa38f" stroke="#1fa38f" stroke-width="0" /><text x="62" y="208" font-size="12" font-weight="800" fill="#1fa38f">01  TRUSTED SOURCE</text><text x="62" y="237" font-size="18" font-weight="650" fill="#1b2943">Approved directory</text><text x="62" y="264" font-size="14" font-weight="400" fill="#596b84">Trusted by user</text><path d="M311 240 L357 240" stroke="#cdd9e6" stroke-width="2" fill="none" /><path d="M347 233l10 7-10 7" stroke="#cdd9e6" stroke-width="2" fill="none"/><rect x="357" y="178" width="352" height="124" rx="13" fill="#f7f8fc" stroke="#dfe6ef" stroke-width="1.5" /><text x="378" y="208" font-size="11" font-weight="750" fill="#596b84">CRITICAL PARAMETER / EMAIL TO</text><text x="378" y="239" font-size="16" font-weight="650" fill="#1b2943">verified@partner.example</text><text x="378" y="266" font-size="13" font-weight="400" fill="#596b84">Trace recipient to its origin</text><path d="M709 240 L752 240" stroke="#cdd9e6" stroke-width="2" fill="none" /><path d="M742 233l10 7-10 7" stroke="#cdd9e6" stroke-width="2" fill="none"/><rect x="752" y="178" width="326" height="124" rx="12" fill="#ffffff" stroke="#1fa38f" stroke-width="1.5" /><text x="773" y="213" font-size="17" font-weight="800" fill="#1fa38f">ALLOW</text><text x="773" y="242" font-size="14" font-weight="400" fill="#334461">Requested + scoped destination</text><text x="773" y="265" font-size="12" font-weight="400" fill="#596b84">Before side effects</text><rect x="42" y="316" width="269" height="124" rx="13" fill="#ffffff" stroke="#dfe6ef" stroke-width="1.5" /><rect x="42" y="316" width="7" height="124" rx="5" fill="#c85d74" stroke="#c85d74" stroke-width="0" /><text x="62" y="346" font-size="12" font-weight="800" fill="#c85d74">02  UNTRUSTED SOURCE</text><text x="62" y="375" font-size="18" font-weight="650" fill="#1b2943">Injected email text</text><text x="62" y="402" font-size="14" font-weight="400" fill="#596b84">Lower-trust tool text</text><path d="M311 378 L357 378" stroke="#cdd9e6" stroke-width="2" fill="none" /><path d="M347 371l10 7-10 7" stroke="#cdd9e6" stroke-width="2" fill="none"/><rect x="357" y="316" width="352" height="124" rx="13" fill="#f7f8fc" stroke="#dfe6ef" stroke-width="1.5" /><text x="378" y="346" font-size="11" font-weight="750" fill="#596b84">CRITICAL PARAMETER / EMAIL TO</text><text x="378" y="377" font-size="16" font-weight="650" fill="#1b2943">export@outside.example</text><text x="378" y="404" font-size="13" font-weight="400" fill="#596b84">Trace recipient to its origin</text><path d="M709 378 L752 378" stroke="#cdd9e6" stroke-width="2" fill="none" /><path d="M742 371l10 7-10 7" stroke="#cdd9e6" stroke-width="2" fill="none"/><rect x="752" y="316" width="326" height="124" rx="12" fill="#ffffff" stroke="#c85d74" stroke-width="1.5" /><text x="773" y="351" font-size="17" font-weight="800" fill="#c85d74">BLOCK</text><text x="773" y="380" font-size="14" font-weight="400" fill="#334461">Attacker-chosen recipient</text><text x="773" y="403" font-size="12" font-weight="400" fill="#596b84">Before side effects</text></svg>
