<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Source-backed schematic: input evidence, known and held-out corruptions, probabilistic agent, evaluation metrics and response policies."><title>CORA end-to-end evidence corruption and decision evaluation pipeline</title><desc>Source-backed schematic: input evidence, known and held-out corruptions, probabilistic agent, evaluation metrics and response policies.</desc><rect x="0" y="0" width="1200" height="480" rx="0" fill="#121923" stroke="none" stroke-width="1"/><text x="42" y="47" fill="#8cc7ff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="2">01 / SYSTEM ARCHITECTURE</text><text x="42" y="89" fill="#f7f8fb" font-size="32" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="start" >From evidence to a calibrated decision</text><text x="42" y="120" fill="#b3bccb" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" >One pipeline, three test domains, seven controlled input corruptions.</text><rect x="42" y="157" width="216" height="179" rx="14" fill="#182130" stroke="#42526b" stroke-width="1.4"/><rect x="59" y="177" width="6" height="16" rx="3" fill="#8cc7ff" stroke="none" stroke-width="1"/><text x="76" y="191" fill="#8cc7ff" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing=".7">DATA / NO LEAKAGE</text><text x="59" y="235" fill="#f7f8fb" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="730" text-anchor="start" >Time-t evidence</text><text x="59" y="273" fill="#e4e8f1" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" >Price, desk score, headlines</text><path d="M263 245 h18 m-7 -7 l7 7 -7 7" fill="none" stroke="#b3bccb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/