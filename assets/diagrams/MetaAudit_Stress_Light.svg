<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="438" viewBox="0 0 1200 438" role="img"><title>MetaAudit research visualization</title><rect width="1200" height="438" fill="#FBFCFE"/><text x="42" y="45" fill="#785DAF" font-size="13" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start" letter-spacing="2.2">ADVERSARIAL EVALUATION</text><text x="42" y="88" fill="#172943" font-size="34" font-weight="610" font-family="Inter,Arial,sans-serif" text-anchor="start">Instructions inside the item can manipulate the judge.</text><rect x="42" y="136" width="525" height="245" rx="12" fill="#FBEAEF" stroke="#D6DDEA" stroke-width="1.4"/><rect x="592" y="136" width="565" height="245" rx="12" fill="#E5F6F1" stroke="#D6DDEA" stroke-width="1.4"/><text x="70" y="174" fill="#B95F7A" font-size="16" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">UNPROTECTED / DEEPSEEK</text><text x="70" y="240" fill="#172943" font-size="60" font-weight="610" font-family="Inter,Arial,sans-serif" text-anchor="start">13.9%</text><text x="70" y="284" fill="#4C5D79" font-size="21" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Defect evasion rate</text><text x="620" y="174" fill="#1A8A7B" font-size="16" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">SPOTLIGHTING / DEEPSEEK</text><text x="620" y="240" fill="#172943" font-size="60" font-weight="610" font-family="Inter,Arial,sans-serif" text-anchor="start">4.9%</text><text x="620" y="284" fill="#4C5D79" font-size="21" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Defect evasion rate</text><text x="70" y="348" fill="#4C5D79" font-size="18" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Off</text><text x="620" y="348" fill="#4C5D79" font-size="18" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">On · model-dependent mitigation</text><text x="42" y="414" fill="#64738B" font-size="17" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Paired prompt-injection evaluation; this did not establish universal immunity.</text></svg>
