<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img"><title>MetaAudit research visualization</title><rect width="1200" height="425" fill="#070B12"/><text x="42" y="45" fill="#C2B7FF" font-size="13" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start" letter-spacing="2.2">THE AUDIT PIPELINE</text><text x="42" y="88" fill="#F5F7FD" font-size="38" font-weight="600" font-family="Inter,Arial,sans-serif" text-anchor="start">Correct the judge. Keep the speed.</text><rect x="42" y="155" width="196" height="160" rx="13" fill="#14273B" stroke="#344158" stroke-width="1.4"/><text x="60" y="189" fill="#8CC7FF" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">01</text><text x="60" y="237" fill="#F5F7FD" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">DATASET</text><text x="60" y="266" fill="#D5DCEB" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">21,362 scored answers</text><path d="M240 233 h31 m-10 -8 l10 8 -10 8" stroke="#B0BCD0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="272" y="155" width="196" height="160" rx="13" fill="#27213F" stroke="#344158" stroke-width="1.4"/><text x="290" y="189" fill="#C2B7FF" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">02</text><text x="290" y="237" fill="#F5F7FD" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">LLM JUDGE</text><text x="290" y="266" fill="#D5DCEB" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Score every item</text><path d="M470 233 h31 m-10 -8 l10 8 -10 8" stroke="#B0BCD0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="502" y="155" width="196" height="160" rx="13" fill="#123431" stroke="#344158" stroke-width="1.4"/><text x="520" y="189" fill="#7FE1CC" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">03</text><text x="520" y="237" fill="#F5F7FD" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">RANDOM AUDIT</text><text x="520" y="266" fill="#D5DCEB" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Inspect n human labels</text><path d="M700 233 h31 m-10 -8 l10 8 -10 8" stroke="#B0BCD0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="732" y="155" width="196" height="160" rx="13" fill="#392232" stroke="#344158" stroke-width="1.4"/><text x="750" y="189" fill="#FF8EA1" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">04</text><text x="750" y="237" fill="#F5F7FD" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">RESIDUAL</text><text x="750" y="266" fill="#D5DCEB" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Human − judge</text><path d="M930 233 h31 m-10 -8 l10 8 -10 8" stroke="#B0BCD0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="962" y="155" width="196" height="160" rx="13" fill="#352D18" stroke="#344158" stroke-width="1.4"/><text x="980" y="189" fill="#FFD56F" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">05</text><text x="980" y="237" fill="#F5F7FD" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">PPI++</text><text x="980" y="266" fill="#D5DCEB" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Rate + valid interval</text><path d="M42 359 L1153 359" stroke="#344158" stroke-width="1.5" fill="none"/><text x="42" y="392" fill="#D5DCEB" font-size="19" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">All judge scores are available; only a random audit uses trusted labels.</text></svg>
