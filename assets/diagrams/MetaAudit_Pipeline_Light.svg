<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img"><title>MetaAudit research visualization</title><rect width="1200" height="425" fill="#FBFCFE"/><text x="42" y="45" fill="#785DAF" font-size="13" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start" letter-spacing="2.2">THE AUDIT PIPELINE</text><text x="42" y="88" fill="#172943" font-size="38" font-weight="600" font-family="Inter,Arial,sans-serif" text-anchor="start">Correct the judge. Keep the speed.</text><rect x="42" y="155" width="196" height="160" rx="13" fill="#E8F1FF" stroke="#D6DDEA" stroke-width="1.4"/><text x="60" y="189" fill="#2C78B8" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">01</text><text x="60" y="237" fill="#172943" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">DATASET</text><text x="60" y="266" fill="#4C5D79" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">21,362 scored answers</text><path d="M240 233 h31 m-10 -8 l10 8 -10 8" stroke="#64738B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="272" y="155" width="196" height="160" rx="13" fill="#F1EBFC" stroke="#D6DDEA" stroke-width="1.4"/><text x="290" y="189" fill="#785DAF" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">02</text><text x="290" y="237" fill="#172943" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">LLM JUDGE</text><text x="290" y="266" fill="#4C5D79" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Score every item</text><path d="M470 233 h31 m-10 -8 l10 8 -10 8" stroke="#64738B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="502" y="155" width="196" height="160" rx="13" fill="#E5F6F1" stroke="#D6DDEA" stroke-width="1.4"/><text x="520" y="189" fill="#1A8A7B" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">03</text><text x="520" y="237" fill="#172943" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">RANDOM AUDIT</text><text x="520" y="266" fill="#4C5D79" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Inspect n human labels</text><path d="M700 233 h31 m-10 -8 l10 8 -10 8" stroke="#64738B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="732" y="155" width="196" height="160" rx="13" fill="#FBEAEF" stroke="#D6DDEA" stroke-width="1.4"/><text x="750" y="189" fill="#B95F7A" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">04</text><text x="750" y="237" fill="#172943" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">RESIDUAL</text><text x="750" y="266" fill="#4C5D79" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Human − judge</text><path d="M930 233 h31 m-10 -8 l10 8 -10 8" stroke="#64738B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="962" y="155" width="196" height="160" rx="13" fill="#FFF3DB" stroke="#D6DDEA" stroke-width="1.4"/><text x="980" y="189" fill="#A77824" font-size="15" font-weight="800" font-family="Inter,Arial,sans-serif" text-anchor="start">05</text><text x="980" y="237" fill="#172943" font-size="22" font-weight="750" font-family="Inter,Arial,sans-serif" text-anchor="start">PPI++</text><text x="980" y="266" fill="#4C5D79" font-size="15" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">Rate + valid interval</text><path d="M42 359 L1153 359" stroke="#D6DDEA" stroke-width="1.5" fill="none"/><text x="42" y="392" fill="#4C5D79" font-size="19" font-weight="500" font-family="Inter,Arial,sans-serif" text-anchor="start">All judge scores are ava