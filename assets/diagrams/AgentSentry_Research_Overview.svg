<path d="M584 357 H635" stroke="#8793b6" stroke-width="3" marker-end="url(#arrow)"/>
<!-- gate container -->
<rect x="639" y="185" width="447" height="368" rx="15" fill="#fcfdff" stroke="#c6d4e9" stroke-width="2.5" filter="url(#shade)"/>
<rect x="660" y="205" rx="6" width="238" height="30" fill="#e8edf9"/>
<text x="673" y="226" class="label" fill="#5c75aa">PRE-EXECUTION GATE</text>
<rect x="659" y="263" width="405" height="107" rx="10" fill="#eff8f5" stroke="#c1e1d5" stroke-width="1.6"/>
<rect x="673" y="277" width="40" height="25" rx="7" fill="#d2ece1"/>
<text x="685" y="295" class="num">04</text>
<text x="725" y="297" class="heading" font-size="23">Provenance + policy</text>
<text x="676" y="323" class="body">Critical values: trusted / untrusted / unattested</text>
<text x="676" y="349" class="small">High-risk policy violation → hard block floor</text>
<rect x="659" y="385" width="405" height="111" rx="10" fill="#f2f4fc" stroke="#d8dbef" stroke-width="1.6"/>
<rect x="673" y="399" width="40" height="25" rx="7" fill="#e4e8f8"/>
<text x="685" y="418" class="num">05</text>
<text x="725" y="420" class="heading" font-size="23">Trajectory GBM</text>
<text x="675" y="446" class="body">31 features + risk-transition surprisal</text>
<text x="675" y="472" class="small">Handles softer, context-dependent signals</text>
<text x="671" y="533" class="small">Calibrated on separate clean episodes · α = 0.05</text>
<path d="M1086 358 H1127" stroke="#8793b6" stroke-width="3" marker-end="url(#arrow)"/>
<!-- decisions -->
<rect x="1132" y="242" width="269" height="224" rx="15" fill="#f8fbff" stroke="#d2ddef" stroke-width="2"/>
<rect x="1150" y="260" width="42" height="26" rx="7" fill="#e6edf9"/>
<text x="1163" y="278" class="num">06</text>
<text x="1150" y="319" class="heading">Decision</text>
<rect x="1150" y="343" width="226" height="36" rx="6" fill="#e5f5ee"/>
<text x="1164" y="366" class="value" fill="#216e5a">ALLOW / authorize</text>
<rect x="1150" y="387" width="226" height="36" rx="6" fill="#f9e8ec"/>
<text x="1164" y="410" class="value" fill="#a94f65">BLOCK / before harm</text>
<text x="1150" y="449" class="small">Replan or escalate when flagged</text>
<!-- result footer -->
<line x1="37" y1="597" x2="1402" y2="597" stroke="#dde5ed" stroke-width="2"/>
<text x="37" y="632" class="label" fill="#7d6caf">MEASURED CORE RESULT / FINAL-V1</text>
<text x="37" y="698" class="stat">34/34</text>
<text x="186" y="680" class="body">observed exploits</text><text x="186" y="705" class="body">caught before harm</text>
<line x1="476" y1="635" x2="476" y2="722" stroke="#dce3ee" stroke-width="2"/>
<text x="512" y="698" class="stat">0/120</text>
<text x="661" y="680" class="body">clean unseen-server</text><text x="661" y="705" class="body">episodes falsely flagged</text>
<line x1="990" y1="635" x2="990" y2="722" stroke="#dce3ee" stroke-width="2"/>
<text x="1020" y="698" class="stat">99.7%</text>
<text x="1217" y="680" class="body">clean-task</text><text x="1217" y="705" class="body">success</text>
<text x="37" y="743" class="small">CONTROLLED EVALUATION · GPT-4o-mini · one seed · synthetic environment · not production deployment</text>
</svg>
