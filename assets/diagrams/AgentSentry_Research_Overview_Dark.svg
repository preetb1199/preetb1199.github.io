<rect x="372" y="272" width="43" height="26" rx="7" fill="#40395e"/>
<text x="386" y="290" class="num">03</text>
<text x="372" y="338" class="heading">LLM agent</text>
<text x="372" y="368" class="body">GPT-4o-mini</text>
<rect x="373" y="390" width="191" height="57" rx="8" fill="#1c2940" stroke="#536182"/>
<text x="385" y="413" class="small">Proposes a tool call</text>
<text x="385" y="432" class="small">+ argument values</text>
