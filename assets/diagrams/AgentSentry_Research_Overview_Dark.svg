<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">AgentSentry: prompt injection enters through untrusted tools, but execution is guarded by provenance and trajectory analysis</title>
<desc id="desc">A six-stage security pipeline. A legitimate user task and third-party content feed a tool-using GPT-4o-mini agent. An intercepted proposed tool call is checked for scope, risk and critical argument provenance, then evaluated by a gradient-boosted trajectory model. High-confidence violations are blocked; otherwise the calibrated decision may allow, block, quarantine and replan, or escalate. Measured core results shown below: 34 of 34 observed exploits caught, zero of 120 clean unseen-server episodes falsely flagged, and 99.7 percent clean task success with hybrid blocking.</desc>
<defs>
  <style><![CDATA[
    .label{font-family:Arial,sans-serif;font-weight:700;font-size:16px;fill:#bdb8d4;letter-spacing:2.1px}
    .heading{font-family:Arial,sans-serif;font-weight:650;font-size:28px;fill:#f0f3ff}
    .body{font-family:Arial,sans-serif;font-weight:450;font-size:18px;fill:#b9c7dd}
    .small{font-family:Arial,sans-serif;font-weight:500;font-size:14px;fill:#bbcee6}
    .num{font-family:Arial,sans-serif;font-weight:750;font-size:15px;fill:#d6bfff}
    .stat{font-family:Georgia,serif;font-weight:450;font-size:43px;fill:#d2bafc}
    .value{font-family:Arial,sans-serif;font-weight:750;font-size:17px;fill:#edf2ff}
    .stroke{stroke:#425675;stroke-width:2}
  ]]></style>
  <filter id="shade" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#080e1a" flood-opacity=".06"/></filter>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#a4bade" stroke-width="1.7" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="760" fill="#0e1524"/>
<rect x="34" y="31" rx="9" width="260" height="31" fill="#30294a"/>
<text x="49" y="52" class="label" font-size="13" fill="#c6a9fb">AGENTSENTRY / CORE STUDY</text>
<text x="35" y="108" font-family="Georgia,serif" font-size="50" fill="#f1f5ff">From untrusted content to controlled execution</text>
<text x="37" y="141" class="body">The runtime checks each proposed action at the last safe moment — before any tool side effect occurs.</text>
<!-- top left, two origins -->
<rect x="37" y="188" width="248" height="172" rx="13" fill="#1b2b42" stroke="#3b5475" stroke-width="2"/>
<rect x="53" y="206" width="43" height="26" rx="7" fill="#2d4367"/>
<text x="67" y="224" class="num">01</text>
<text x="54" y="264" class="heading" font-size="24">User task</text>
<text x="54" y="293" class="body">Authorized request,</text>
<text x="54" y="318" class="body">available tool scopes</text>
<rect x="37" y="381" width="248" height="172" rx="13" fill="#2d2437" stroke="#6b435a" stroke-width="2"/>
<rect x="53" y="399" width="43" height="26" rx="7" fill="#4a354e"/>
<text x="67" y="417" class="num">02</text>
<text x="54" y="458" class="heading" font-size="24">External content</text>
<text x="54" y="487" class="body">Email, file, web,</text>
<text x="54" y="512" class="body">CRM, chat, tool text</text>
<text x="54" y="537" class="small" fill="#f0a9c2">UNTRUSTED / SOURCE-LABELED</text>
<!-- connection agent -->
<path d="M285 272 H316 V325 H351" fill="none" stroke="#8fb7e5" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M285 466 H316 V348 H351" fill="none" stroke="#e494b2" stroke-width="3" marker-end="url(#arrow)"/>
<!-- agent -->
