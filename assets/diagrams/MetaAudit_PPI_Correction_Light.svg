<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img"><title>MetaAudit PPI plus plus correction on a 10-item textbook example</title><rect x="0" y="0" width="1200" height="450" rx="0" fill="#FBFCFE" stroke="none" stroke-width="1.4"/><text x="45" y="44" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#7C65DE">PPI++ / WORKED EXAMPLE</text><text x="45" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#172943">Measure the model. Then measure its error.</text><rect x="45" y="132" width="332" height="158" rx="14" fill="#EAF3FE" stroke="#D9E1EE" stroke-width="1.4"/><text x="67" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#327FCE">FULL POPULATION</text><text x="67" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#4D607A">Judge mean</text><text x="67" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#172943">38%</text><rect x="434" y="132" width="332" height="158" rx="14" fill="#E6F5F1" stroke="#D9E1EE" stroke-width="1.4"/><text x="456" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#188F81">RANDOM AUDIT</text><text x="456" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#4D607A">Human mean</text><text x="456" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#172943">40%</text><rect x="823" y="132" width="332" height="158" rx="14" fill="#F0EDFF" stroke="#D9E1EE" stroke-width="1.4"/><text x="845" y="167" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#7C65DE">SAME AUDIT</text><text x="845" y="205" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#4D607A">Judge mean</text><text x="845" y="261" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="600" fill="#172943">42%</text><path d="M45 326 L1155 326" stroke="#D9E1EE" stroke-width="1.7" fill="none"/><rect x="46" y="355" width="1110" height="59" rx="10" fill="#F4F7FC" stroke="#D9E1EE" stroke-width="1.4"/><text x="68" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#327FCE">FULL JUDGE</text><text x="237" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#172943">38%</text><text x="337" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="550" fill="#64758E">+</text><text x="391" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#188F81">AUDIT RESIDUAL</text><text x="588" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#172943">(40 − 42) = −2 pp</text><text x="828" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="550" fill="#64758E">=</text><text x="870" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800" fill="#7C65DE">36%</text><text x="967" y="392" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#4D607A">PPI estimate</text><text x="45" y="440" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#64758E">Illustrative textbook example: reference truth = 30%; no one audit is guaranteed to be exact.</text></svg>
