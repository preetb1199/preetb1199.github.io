<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 455" role="img" aria-labelledby="title desc"><title id="title">AgentSentry research explanatory diagram</title><desc id="desc">A source-grounded scientific illustration. This is not experimental log output.</desc><rect width="1120" height="455" fill="#070b12"/><text x="44" y="60" font-size="14" font-weight="700" fill="#c2b7ff">PROVENANCE / FOLLOW THE ARGUMENT</text><text x="44" y="100" font-size="30" font-weight="500" fill="#f7f8fb">The same tool can be safe or unsafe.</text><text x="44" y="136" font-size="16" font-weight="400" fill="#b3bccb">Authorization depends on the origin and scope of each critical value.</text><rect x="42" y="178" width="269" height="124" rx="13" fill="#121923" stroke="#293344" stroke-width="1.5" /><rect x="42" y="178" width="7" height="124" rx="5" fill="#7fe1cc" stroke="#7fe1cc" stroke-width="0" /><text x="62" y="208" font-size="12" font-weight="800" fill="#7fe1cc">01  TRUSTED SOURCE</text><text x="62" y="237" font-size="18" font-weight="650" fill="#f7f8fb">Approved directory</text><text x="62" y="264" font-size="14" font-weight="400" fill="#b3bccb">Trusted by user</text><path d="M311 240 L357 240" stroke="#42526b" stroke-width="2" fill="none" /><path d="M347 233l10 7-10 7" stroke="#42526b" stroke-width="2" fill="none"/><rect x="357" y="178" width="352" height="124" rx="13" fill="#182130" stroke="#293344" stroke-width="1.5" /><text x="378" y="208" font-size="11" font-weight="750" fill="#b3bccb">CRITICAL PARAMETER / EMAIL TO</text><text x="378" y="239" font-size="16" font-weight="650" fill="#f7f8fb">verified@partner.example</text><text x="378" y="266" font-size="13" font-weight="400" fill="#b3bccb">Trace recipient to its origin</text><path d="M709 240 L752 240" stroke="#42526b" stroke-width="2" fill="none" /><path d="M742 233l10 7-10 7" stroke="#42526b" stroke-width="2" fill="none"/><rect x="752" y="178" width="326" height="124" rx="12" fill="#121923" stroke="#7fe1cc" stroke-width="1.5" /><text x="773" y="213" font-size="17" font-weight="800" fill="#7fe1cc">ALLOW</text><text x="773" y="242" font-size="14" font-weight="400" fill="#e4e8f1">Requested + scoped destination</text><text x="773" y="265" font-size="12" font-weight="400" fill="#b3bccb">Before side effects</text><rect x="42" y="316" width="269" height="124" rx="13" fill="#121923" stroke="#293344" stroke-width="1.5" /><rect x="42" y="316" width="7" height="124" rx="5" fill="#ff8ea1" stroke="#ff8ea1" stroke-width="0" /><text x="62" y="346" font-size="12" font-weight="800" fill="#ff8ea1">02  UNTRUSTED SOURCE</text><text x="62" y="375" font-size="18" font-weight="650" fill="#f7f8fb">Injected email text</text><text x="62" y="402" font-size="14" font-weight="400" fill="#b3bccb">Lower-trust tool text</text><path d="M311 378 L357 378" stroke="#42526b" stroke-width="2" fill="none" /><path d="M347 371l10 7-10 7" stroke="#42526b" stroke-width="2" fill="none"/><rect x="357" y="316" width="352" height="124" rx="13" fill="#182130" stroke="#293344" stroke-width="1.5" /><text x="378" y="346" font-size="11" font-weight="750" fill="#b3bccb">CRITICAL PARAMETER / EMAIL TO</text><text x="378" y="377" font-size="16" font-weight="650" fill="#f7f8fb">export@outside.example</text><text x="378" y="404" font-size="13" font-weight="400" fill="#b3bccb">Trace recipient to its origin</text><path d="M709 378 L752 378" stroke="#42526b" stroke-width="2" fill="none" /><path d="M742 371l10 7-10 7" stroke="#42526b" stroke-width="2" fill="none"/><rect x="752" y="316" width="326" height="124" rx="12" fill="#121923" stroke="#ff8ea1" stroke-width="1.5" /><text x="773" y="351" font-size="17" font-weight="800" fill="#ff8ea1">BLOCK</text><text x="773" y="380" font-size="14" font-weight="400" fill="#e4e8f1">Attacker-chosen recipient</text><text x="773" y="403" font-size="12" font-weight="400" fill="#b3bccb">Before side effects</text></svg>
