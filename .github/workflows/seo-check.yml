name: SEO & Academic Discoverability Regression Audit

on:
  push:
    branches: [main, seo-optimization, research-authority-expansion]
  pull_request:
    branches: [main]

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run technical SEO, structured data, image, IndexNow & secret-hygiene audit
        run: python3 scripts/seo_audit.py --check-external

      - name: Verify IndexNow submission helper syntax
        run: python3 scripts/indexnow_submit.py --dry-run --urls https://www.preet-baxi.com/
